[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-worklog"
dynamic = ["version"]
description = "A local work tracker: NWA (network/activity) hours by pay period, project budgets, deliverables, leave, an Obsidian vault and an AI assistant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Keystone Worklog contributors" }]
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]
keywords = ["timesheet", "time tracking", "obsidian", "kanban", "leave", "llm", "assistant", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Editors :: Text Processing",
]

[project.optional-dependencies]
search = ["lancedb>=0.20"]   # meaning search in the AI assistant (keyword search works without it)

[project.scripts]
keystone-worklog = "keystone_worklog.app:main"
keystone-worklog-bundle = "keystone_worklog.offline_bundle:main"

# [project.urls]  – add once the GitHub repository exists, e.g.
# Homepage = "https://github.com/<you>/keystone-worklog"
# Issues = "https://github.com/<you>/keystone-worklog/issues"

[tool.setuptools.dynamic]
version = { attr = "keystone_worklog.__version__" }

[tool.setuptools.packages.find]
include = ["keystone_worklog*"]

[tool.setuptools.package-data]
keystone_worklog = ["static/*", "static/vendor/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]
